<!-- ===================================================================== -->
<!-- EqualReach AI Drafter — full-page embed for the Webflow "AI Drafter"    -->
<!-- page. Paste into Footer Code (Project Settings) or the "Before </body>" -->
<!-- box (Page Settings). Safe site-wide: on pages with no drafter iframe it -->
<!-- finds nothing and does nothing.                                         -->
<!--                                                                        -->
<!-- Sizes the frame to the space actually left below the nav.               -->
<!--                                                                        -->
<!-- Why this exists: the drafter iframe is given height:100vh, but it       -->
<!-- starts *below* the Webflow nav. 100vh is the whole window, so the frame -->
<!-- overhangs the fold by the nav's height and its bottom row — the text    -->
<!-- input — can't be reached. The app can't fix this from inside: within an -->
<!-- iframe, 100vh/100dvh both resolve to the frame's own height, so it has  -->
<!-- no way to know part of itself is off-screen. Only the host can size it. -->
<!-- ===================================================================== -->
<script>
  (function () {
    var ATTRIBUTION_KEY = 'er_first_touch_attribution';

    // Match the drafter frame by host rather than by query string, so this
    // works whether the embed URL is ?embed=draft, #/draft, or a bare link.
    function frames() {
      return Array.prototype.slice.call(document.querySelectorAll('iframe')).filter(function (f) {
        var src = f.getAttribute('src') || '';
        if (src.indexOf('er-project-drafter') === -1 && src.indexOf('embed=draft') === -1) return false;
        if (f.closest && f.closest('#er-panel')) return false;
        return true;
      });
    }

    // Carry the prompt and first-touch acquisition context from Webflow into
    // the cross-origin Vercel iframe. Inside the iframe document.referrer is
    // only this Webflow page, so the original referrer must be forwarded here.
    // Assign only when values differ so the settle loop never reloads it twice.
    function firstTouchAttribution() {
      var pageParams = new URLSearchParams(window.location.search);
      try {
        var saved = JSON.parse(sessionStorage.getItem(ATTRIBUTION_KEY) || 'null');
        if (saved && saved.source && saved.landingPath) return saved;
      } catch (_) {}

      var referrerHost = '';
      try { referrerHost = new URL(document.referrer).hostname.replace(/^www\./, '').toLowerCase(); } catch (_) {}
      var currentHost = window.location.hostname.replace(/^www\./, '').toLowerCase();
      if (referrerHost === currentHost) referrerHost = '';
      var passthrough = ['utm_source', 'utm_medium', 'utm_campaign', 'utm_term', 'utm_content', 'gclid', 'fbclid', 'msclkid'];
      var attribution = {
        source: (pageParams.get('utm_source') || '').trim() || referrerHost || 'direct',
        referrerHost: referrerHost,
        landingPath: window.location.pathname,
        params: {},
      };
      passthrough.forEach(function (key) {
        var value = pageParams.get(key);
        if (value) attribution.params[key] = value;
      });
      try { sessionStorage.setItem(ATTRIBUTION_KEY, JSON.stringify(attribution)); } catch (_) {}
      return attribution;
    }

    function forwardPageContext() {
      var pageParams = new URLSearchParams(window.location.search);
      var prompt = pageParams.get('initial_prompt');
      var attribution = firstTouchAttribution();

      frames().forEach(function (f) {
        try {
          var url = new URL(f.src, window.location.href);
          var changed = false;
          function setParam(key, value) {
            if (!value || url.searchParams.get(key) === value) return;
            url.searchParams.set(key, value);
            changed = true;
          }
          setParam('initial_prompt', prompt && prompt.trim());
          Object.keys(attribution.params).forEach(function (key) {
            setParam(key, attribution.params[key]);
          });
          setParam('er_source', attribution.source);
          setParam('er_referrer_host', attribution.referrerHost);
          setParam('er_landing_path', attribution.landingPath);
          if (changed) f.src = url.toString();
        } catch (_) {}
      });
    }

    function fit() {
      frames().forEach(function (f) {
        // Distance from the top of the *document*, not the viewport. Using the
        // viewport would feed back on itself: scrolling down shrinks rect.top,
        // which grows the frame, which lengthens the page, which allows more
        // scroll. Document-relative offset is stable at any scroll position.
        var rect = f.getBoundingClientRect();
        var offset = rect.top + (window.scrollY || window.pageYOffset || 0);
        // Floor so the drafter never collapses to nothing on short windows.
        var height = Math.max(480, window.innerHeight - offset);
        // Only write on a real change. Unconditional writes would make the
        // ResizeObserver below re-enter fit() forever.
        if (Math.abs(rect.height - height) < 1) return;
        // Webflow's own styles can carry !important, so match it.
        f.style.setProperty('height', height + 'px', 'important');
      });
    }

    // The floating bubble is installed site-wide, but on a page that already
    // embeds the full drafter it is redundant — two ways into the same flow,
    // one of them covering the other's composer. Suppress it here rather than
    // per-page in Webflow, so it stays hidden wherever the drafter is embedded.
    // A stylesheet !important rule, because the bubble script drives the dock
    // with inline display styles, which this has to outrank.
    function hide() {
      // Runs on the same settle loop as fit(), not once at parse: if the frame
      // is not in the DOM yet on first pass, a one-shot check would give up and
      // leave the bubble showing forever.
      if (!frames().length || document.getElementById('er-hide')) return;
      var s = document.createElement('style');
      s.id = 'er-hide';
      s.textContent = '#er-dock,#er-panel,#er-backdrop{display:none !important}';
      (document.head || document.documentElement).appendChild(s);
    }

    function go() { forwardPageContext(); hide(); fit(); }

    // Browser history belongs to the Webflow page, not its cross-origin
    // drafter iframe. Handle the drafter's navigation request in the parent.
    window.addEventListener('message', function (event) {
      if (event.origin !== 'https://er-project-drafter.vercel.app') return;
      if (!event.data || event.data.type !== 'er-website-drafter-back') return;
      window.history.back();
    });

    window.addEventListener('resize', go);
    window.addEventListener('orientationchange', go);
    document.addEventListener('DOMContentLoaded', go);
    window.addEventListener('load', go);

    // Why this is not a one-shot: measuring during load can catch the frame
    // before Webflow has laid out the nav, when its offset is still 0. That
    // yields a full-viewport height — indistinguishable from the 100vh bug it
    // is meant to replace — and a single late timeout is a guess at when the
    // page settles. So re-check until the layout stops moving, and keep
    // watching for anything that shifts the frame afterwards.
    var settle = setInterval(go, 250);
    setTimeout(function () { clearInterval(settle); }, 15000);

    if (window.ResizeObserver) {
      new ResizeObserver(go).observe(document.documentElement);
    }

    go();
  })();
</script>
