<script>
(function(){
function q(){return[].slice.call(document.querySelectorAll('iframe')).filter(function(f){var s=f.getAttribute('src')||'';if(s.indexOf('er-project-drafter')<0&&s.indexOf('embed=draft')<0)return false;return!(f.closest&&f.closest('#er-panel'))})}
function p(){var p=new URLSearchParams(location.search).get('initial_prompt');if(!p||!p.trim())return;q().forEach(function(f){try{var u=new URL(f.src,location.href);if(u.searchParams.get('initial_prompt')===p)return;u.searchParams.set('initial_prompt',p);f.src=u.toString()}catch(e){}})}
function fit(){q().forEach(function(f){var r=f.getBoundingClientRect(),o=r.top+(window.scrollY||0),h=Math.max(480,window.innerHeight-o);if(Math.abs(r.height-h)<1)return;f.style.setProperty('height',h+'px','important')})}
function hide(){if(!q().length||document.getElementById('er-hide'))return;var s=document.createElement('style');s.id='er-hide';s.textContent='#er-dock,#er-panel,#er-backdrop{display:none!important}';(document.head||document.documentElement).appendChild(s)}
function go(){p();hide();fit()}
addEventListener('message',function(e){if(e.origin==='https://er-project-drafter.vercel.app'&&e.data&&e.data.type==='er-website-drafter-back')history.back()});
addEventListener('resize',go);addEventListener('orientationchange',go);addEventListener('load',go);
document.addEventListener('DOMContentLoaded',go);
var t=setInterval(go,250);setTimeout(function(){clearInterval(t)},15000);
if(window.ResizeObserver)new ResizeObserver(go).observe(document.documentElement);
go()})();
</script>
